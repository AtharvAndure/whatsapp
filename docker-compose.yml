version: '3.8'

services:
  web:
    build: .
    ports:
      - "5501:80"
    volumes:
      # Named volume: Docker now hides and protects your images internally
      - profile_images:/var/www/html/asset/images
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=whatsapp
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: whatsapp
    volumes:
      - db_data:/var/lib/mysql
      - ./whatsappDB.sql:/docker-entrypoint-initdb.d/whatsappDB.sql

volumes:
  db_data:
  profile_images: